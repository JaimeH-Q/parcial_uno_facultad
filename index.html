<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <form action="" onsubmit="validarFormulario(event)">
        <label for="nombre_apellido">
            <span>Nombre y apellido</span>
            <input type="text" id="nombre_apellido" name="nombre_apellido">
            <span class="error"></span>
        </label>

        <label for="dni">
            <span>DNI</span>
            <input type="number" id="dni" name="dni">
            <span class="error"></span>
        </label>

        <label for="fecha_nacimiento">
            <span>Fecha de nacimiento</span>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
            <span class="error"></span>
        </label>

        <div id="preguntas_progresivas">
            
        </div>
        <div id="botones">
            <input type="submit" value="Enviar">
            <button type="button" id="preguntas_boton" disabled onclick="mostrarPreguntas(event)">Preguntas</button>
        </div>
        <span id="exito"></span>

    </form>

</body>
</html>
